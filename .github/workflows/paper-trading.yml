name: NBA paper trading

# ONE run stays alive for ~5.5 hours and keeps its own clock: `python -m paper.cli loop` runs a pass every
# 5 minutes (build the slate, capture whatever is due, grade finished days, rebuild ledgers/report/site data)
# and PUBLISHES after each pass, so the dashboard updates as it goes. When the run ends it starts its own
# successor (workflow_dispatch from GITHUB_TOKEN is one of the two events GitHub lets a workflow trigger).
#
# Why not a plain cron? GitHub's `schedule` is best-effort: a `*/15` schedule fired TWICE in 17 hours here, and
# the per-game windows (pregame about 2h before tip, closing in the last 25 minutes) need minutes, not hours.
# The cron below is only a safety net that restarts the chain if it ever breaks.
#
# Needs two REPOSITORY secrets (Settings > Secrets and variables > Actions):
#   OPTICODDS_API_KEY  the odds and results feed
#   ROTOWIRE_COOKIE    a logged-in rotowire.com session's Cookie header (the full projection tables)
#
# Data lives on its own branch, `paper-data`; the first run creates it. GitHub only runs `schedule` from the
# DEFAULT branch, so this file must be merged there.

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Run ONE pass with the clock overridden (ISO UTC, e.g. 2026-11-24T22:30:00Z). Blank = the loop."
        required: false
      minutes:
        description: "How long the loop stays alive, polling every 5 minutes (default 330; under 5 = one pass)"
        required: false
        default: "330"

permissions:
  contents: write
  actions: write            # to start the next run

concurrency:
  group: paper-trading      # one at a time: two would race on the data branch
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (create it on first run)
        run: |
          git fetch origin paper-data 2>/dev/null || true
          if git rev-parse --verify origin/paper-data >/dev/null 2>&1; then
            git worktree add data/paper origin/paper-data
            git -C data/paper checkout -B paper-data origin/paper-data
          else
            git worktree add --detach data/paper
            git -C data/paper checkout --orphan paper-data
            git -C data/paper rm -rf . >/dev/null 2>&1 || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run (loops, publishing after every pass)
        id: run
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          # RotoWire returns only a small preview to an anonymous request; the full tables need a logged-in
          # session cookie (see paper/README.md). When it is missing or expired the capture stops with a message
          # saying so, rather than pricing a handful of players.
          ROTOWIRE_COOKIE: ${{ secrets.ROTOWIRE_COOKIE }}
          NOW: ${{ github.event.inputs.now }}
          MINUTES: ${{ github.event.inputs.minutes || '330' }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ -n "$NOW" ]; then
            python -m paper.cli auto --now "$NOW"
          else
            python -m paper.cli loop --minutes "$MINUTES" --every 5 --publish
          fi

      - name: Publish anything left over
        if: always()
        run: |
          cd data/paper
          git config user.name "paper-trading[bot]"
          git config user.email "paper-trading@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "paper data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin paper-data
          fi

      - name: Start the next run
        # Only after a run that actually ran for a while: a run that fails in seconds must not respawn itself
        # in a tight loop (the cron restarts the chain instead).
        if: always() && github.event.inputs.now == ''
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.run.outputs.started }}
        run: |
          ELAPSED=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          if [ "$ELAPSED" -ge 1800 ]; then
            gh workflow run paper-trading.yml --ref "${{ github.event.repository.default_branch }}"
          else
            echo "this run lasted only ${ELAPSED}s, so it is not starting a successor"
          fi
